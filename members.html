<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="云起四海 AI视频翻译会员注册与登录">
  <title>会员中心 · 云起四海</title>
  <link rel="stylesheet" href="/members.css">
  <script src="/members.js" defer></script>
</head>
<body>
  <header class="sitebar"><div class="header-inner"><a class="logo" href="/">✈ 云起四海 <small>AI VIDEO</small></a><a class="home" href="/">返回翻译网站</a></div></header>
  <main class="container">
    <div class="intro"><p class="eyebrow">一方云起 · 四海同行</p><h1>会员中心</h1><p>为张家界导游与旅游创作者打造的独立会员账户。</p></div>
    <section class="panel" id="authCard">
      <div id="signedOutArea">
        <nav class="tabs" aria-label="登录与注册"><button id="tabLogin" type="button" class="active" aria-current="page">会员登录</button><button id="tabSignup" type="button">注册会员</button></nav>
        <form id="authForm">
          <label id="nameField" class="hidden">姓名或昵称<input name="name" id="name" autocomplete="name" maxlength="80" placeholder="请输入姓名或昵称"></label>
          <label>电子邮箱<input name="email" id="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com"></label>
          <label>密码<input name="password" id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="不少于12位"></label>
          <button type="submit" id="submit" class="primary">会员登录</button>
          <p class="hint">注册只需邮箱和密码，目前无需短信验证码。</p>
        </form>
      </div>
      <div id="signedInArea" class="hidden">
        <div class="checkicon">✓</div><h2>已登录会员账户</h2>
        <dl><dt>邮箱</dt><dd id="profileEmail"></dd><dt>姓名</dt><dd id="profileName"></dd><dt>会员编号</dt><dd id="profileId"></dd></dl>
        <p class="alert">目前是内部测试版：邮箱尚未验证，会员翻译额度、付款和订单功能暂未开放；管理员功能不会向会员开放。</p>
        <button id="logout" type="button" class="secondary">退出会员</button>
      </div>
      <p id="status" role="status" aria-live="polite" class="status"></p>
    </section>
    <p class="footer">已有管理员账户？<a href="/#workflow">前往原工作台登录</a></p>
  </main>
</body>
</html>
